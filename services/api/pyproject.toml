[project]
name = "airlock-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "aio-pika>=9.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-bdd>=7.2",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "mypy>=1.10",
    "flake8>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock_api"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

# flake8 doesn't read pyproject.toml natively — see .flake8

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
