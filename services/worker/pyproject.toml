[project]
name = "airlock-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.4",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "flake8>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock_worker"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

# flake8 doesn't read pyproject.toml natively — see .flake8
